<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="no-referrer">
  <title>FileOrganizerCore Checkout</title>
  <style>
    :root{color-scheme:dark;--page:#10121c;--surface:#191c2b;--inset:#202438;--line:#454d79;--text:#f3f4fc;--muted:#afb5ce;--purple:#7545c4;--gold:#f3cd7e;--focus:#acb7ff;--ok:#83dfba;--bad:#ffadb5;--shadow:0 28px 80px #03061255;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;background:radial-gradient(ellipse at 12% 0%,#7545c419,transparent 52%),var(--page);color:var(--text);padding:32px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center}button,summary{-webkit-tap-highlight-color:transparent}button{font:inherit}svg{display:block;flex-shrink:0}header{width:min(100%,880px);display:flex;align-items:center;gap:12px;margin-bottom:32px}.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--purple);color:#fff}.brand-name{font-size:17px;font-weight:700;letter-spacing:-.4px;direction:ltr}.brand-tag{margin-inline-start:auto;color:var(--muted);font-size:12px;letter-spacing:.12em;direction:ltr}
    main{width:min(100%,880px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);border:1px solid var(--line);border-radius:28px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}.overview{padding:36px;min-width:0;background:linear-gradient(145deg,#7545c417,transparent 75%);display:flex;flex-direction:column;gap:25px;border-inline-end:1px solid var(--line)}.eyebrow{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;font-weight:600;margin:0}.eyebrow svg{color:var(--gold)}h1{font-size:clamp(25px,4vw,32px);line-height:1.35;letter-spacing:-.6px;margin:0;font-weight:700;overflow-wrap:anywhere}.plan-name{font-size:14px;color:var(--muted);margin:0 0 10px}.amount-card{border:1px solid #5368d9;border-radius:18px;padding:22px 20px;background:var(--inset);min-width:0}.amount-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;direction:ltr;justify-content:flex-start}.amount{font-size:clamp(25px,5vw,32px);font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.6px;overflow-wrap:anywhere;min-width:0;line-height:1.4}.currency{color:var(--gold);background:#59348d;border:1px solid #5368d9;border-radius:9px;padding:4px 8px;font-size:17px;font-weight:700;line-height:1.4}.summary-note{font-size:13px;color:var(--muted);line-height:1.8;margin:0;display:flex;align-items:flex-start;gap:8px}.summary-note svg{margin-top:3px}.checkout-body{padding:36px;min-width:0;display:flex;flex-direction:column;gap:24px}.status-block{display:flex;flex-direction:column;gap:16px;flex:1}.status-symbol{width:48px;height:48px;border:1px solid var(--line);border-radius:15px;display:grid;place-items:center;color:var(--focus);background:var(--inset)}.status-symbol svg{width:23px;height:23px}.state-icon{display:none}body[data-state="checking"] .icon-loading,body[data-state="waiting"] .icon-clock,body[data-state="ready"] .icon-wallet,body[data-state="success"] .icon-check,body[data-state="error"] .icon-alert,body[data-state="closed"] .icon-alert{display:block}.icon-loading{animation:spin 1.1s linear infinite}#status{font-size:16px;line-height:1.9;overflow-wrap:anywhere;margin:0}body[data-state="success"] .status-symbol{color:var(--ok)}body[data-state="error"] .status-symbol,body[data-state="closed"] .status-symbol{color:var(--bad)}#status.error{color:var(--bad)}
    #payButton{position:relative;display:flex;justify-content:center;align-items:center;width:100%;min-height:52px;border:1px solid #a487de;border-radius:14px;padding:14px 18px;background:var(--purple);color:#fff;font-size:15px;font-weight:650;cursor:pointer;transition:filter .18s,transform .18s;overflow-wrap:anywhere;line-height:1.5}#payButton:hover:not(:disabled){filter:brightness(1.1)}#payButton:active:not(:disabled){transform:translateY(1px)}#payButton:disabled{cursor:wait;opacity:.75}#payButton:disabled::before{content:"";width:16px;height:16px;flex-shrink:0;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;margin-inline-end:10px;animation:spin 1.1s linear infinite}:focus-visible{outline:2px solid var(--focus);outline-offset:4px}.hidden{display:none!important}footer{margin-top:24px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;direction:ltr}.footer-dot{height:3px;width:3px;border-radius:50%;background:var(--muted)}[dir="rtl"] .amount-line{justify-content:flex-end}
    @keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}@media(prefers-color-scheme:light){:root{color-scheme:light;--page:#f3f4fa;--surface:#fff;--inset:#f0f1fa;--line:#c5cbee;--text:#20243b;--muted:#606780;--focus:#5368d9;--ok:#18794d;--bad:#ac293e;--shadow:0 24px 70px #27315912}.eyebrow svg{color:#805c16}}
    @media(max-width:620px){body{padding:24px 16px;justify-content:flex-start}header{margin-bottom:24px}.brand-tag{font-size:10px}main{grid-template-columns:minmax(0,1fr);border-radius:22px}.overview{border-inline-end:0;border-bottom:1px solid var(--line);padding:24px;gap:18px}.checkout-body{padding:24px;gap:22px}.status-block{flex-direction:row;align-items:flex-start;gap:12px}.status-symbol{width:40px;height:40px;border-radius:12px;flex-shrink:0}.status-symbol svg{width:21px;height:21px}#status{font-size:15px}.amount-card{padding:18px}.summary-note{font-size:12px}footer{margin-top:20px}}@media(max-width:360px){.overview,.checkout-body{padding:20px}.brand-tag{display:none}}
  </style>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script src="config.js?v=20261105-core"></script>
<link rel="icon" href="assets/brand/favicon.ico?v=20261110">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<style>.foc-logo{width:36px;height:36px;object-fit:contain;flex:none;vertical-align:middle;border-radius:8px}.foc-brand{display:flex;align-items:center;gap:10px;direction:ltr}</style>
</head>
<body data-state="checking">
  <header><img class="foc-logo" src="assets/brand/logo.png" alt="" width="36" height="36"><span class="brand-name">FileOrganizerCore</span><span class="brand-tag">PI PAYMENTS</span></header>
  <main>
    <section class="overview" aria-labelledby="checkout-heading">
      <p class="eyebrow"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></svg><span id="summary-label"></span></p>
      <h1 id="checkout-heading"></h1>
      <div id="details" class="amount-card hidden"><p class="plan-name" id="plan-label"></p><div class="amount-line"><bdi class="amount" id="plan-amount" dir="ltr"></bdi><span class="currency" aria-label="Pi">Pi</span></div></div>
      <p class="summary-note"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="16" rx="5"/><path d="m10 8 4 4-4 4"/></svg><span id="browser-note"></span></p>
    </section>
    <section class="checkout-body" aria-labelledby="checkout-heading">
      <div class="status-block"><div class="status-symbol" aria-hidden="true">
        <svg class="state-icon icon-loading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12a8 8 0 1 1-8-8"/></svg>
        <svg class="state-icon icon-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <svg class="state-icon icon-wallet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M16 11h5v5h-5a2.5 2.5 0 0 1 0-5Z M4 5l12-3v3"/></svg>
        <svg class="state-icon icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m7 12 3 3 7-7"/></svg>
        <svg class="state-icon icon-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 3v1"/></svg>
      </div><p id="status" role="status" aria-live="polite" aria-atomic="true"></p></div>
      <button id="payButton" class="hidden" type="button"></button>
      
    </section>
  </main>
  <footer><span>FileOrganizerCore</span><span class="footer-dot"></span><span>Pi Network</span></footer>
  <script src="checkout-i18n.js?v=20261105-core"></script>
  <script src="checkout.js?v=20261110-brand"></script>
</body>
</html>
